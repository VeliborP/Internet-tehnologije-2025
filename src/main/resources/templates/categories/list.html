<div th:fragment="content">
    <h2>Categories</h2>

    <div th:replace="fragments/flash-messages :: flashMessages"></div>

    <a class="btn btn-primary mb-3" th:href="@{/categories/new}">Add New Category</a>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.id}"></td>
            <td th:text="${category.name}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{'/categories/edit/' + ${category.id}}">Edit</a>
                <a class="btn btn-sm btn-danger" th:href="@{'/categories/delete/' + ${category.id}}"
                   onclick="return confirm('Are you sure?');">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="3" class="text-center text-muted">No categories available.</td>
        </tr>
        </tbody>
    </table>
</div>
