<div th:fragment="content">
    <h2 th:text="${category.id != null ? 'Edit Category' : 'Add Category'}"></h2>

    <form th:action="@{/categories/save}" th:object="${category}" method="post" class="needs-validation" novalidate>

        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/categories}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
