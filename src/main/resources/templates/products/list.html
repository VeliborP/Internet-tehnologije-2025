<div th:fragment="content">
    <h2>Products</h2>

    <div th:replace="fragments/flash-messages :: flashMessages"></div>

    <a class="btn btn-primary mb-3" th:href="@{/products/new}">Add New Product</a>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Category</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.description}"></td>
            <td th:text="${product.category.name}"></td>
            <td th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}"></td>
            <td>
                <a class="btn btn-sm btn-warning" th:href="@{'/products/edit/' + ${product.id}}">Edit</a>
                <a class="btn btn-sm btn-danger" th:href="@{'/products/delete/' + ${product.id}}"
                   onclick="return confirm('Are you sure?');">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="5" class="text-center text-muted">No products available.</td>
        </tr>
        </tbody>
    </table>
</div>
